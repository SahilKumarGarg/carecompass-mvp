<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Compass outer ring -->
  <circle cx="32" cy="32" r="30" fill="#0F62FE" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="white" stroke-width="1.5" />

  <!-- Cardinal tick marks -->
  <line x1="32" y1="6"  x2="32" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="6"  y1="32" x2="12" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass needle — north (white) points upper-right, south (blue-tipped) lower-left -->
  <polygon points="32,13 28,32 32,29 36,32" fill="white" />
  <polygon points="32,51 28,32 32,35 36,32" fill="rgba(255,255,255,0.35)" />

  <!-- Medical cross at centre — white, 10×10 -->
  <rect x="29" y="26" width="6" height="12" rx="1" fill="white" />
  <rect x="26" y="29" width="12" height="6"  rx="1" fill="white" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background -->

  <!-- Compass ring (thin circle) -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0E7C86" stroke-width="1.5"/>

  <!-- Cardinal ticks: N and S teal (primary), E and W white on teal ring -->
  <!-- North tick (teal, longer) -->
  <line x1="32" y1="2"  x2="32" y2="9"  stroke="#0E7C86" stroke-width="2.5" stroke-linecap="round"/>
  <!-- South tick (teal) -->
  <line x1="32" y1="55" x2="32" y2="62" stroke="#0E7C86" stroke-width="2.5" stroke-linecap="round"/>
  <!-- East tick (teal) -->
  <line x1="55" y1="32" x2="62" y2="32" stroke="#0E7C86" stroke-width="2.5" stroke-linecap="round"/>
  <!-- West tick (teal) -->
  <line x1="2"  y1="32" x2="9"  y2="32" stroke="#0E7C86" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Location pin body: teardrop shape centred around (32, 30), bottom point at (32, 52) -->
  <!-- Circle part of pin -->
  <circle cx="32" cy="27" r="13" fill="#0E7C86"/>
  <!-- Pin tail (triangle below circle) -->
  <polygon points="22,34 42,34 32,52" fill="#0E7C86"/>

  <!-- White medical cross inside pin (centred at 32,27) -->
  <rect x="29" y="21" width="6" height="12" rx="1.2" fill="white"/>
  <rect x="26" y="24" width="12" height="6"  rx="1.2" fill="white"/>
</svg>

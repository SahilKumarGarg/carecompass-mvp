[server]
address = "localhost"
enableXsrfProtection = true
headless = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[ui]
hideTopBar = true

[theme]
base                    = "light"
primaryColor            = "#0E7C86"
backgroundColor         = "#F5FAFB"
secondaryBackgroundColor = "#E4F1F3"
textColor               = "#16313A"
font                    = "sans serif"
